name: Build Android APKs

on:
  push:
    branches: [main]
    paths:
      - 'apps/nukhba-student/**'
      - 'apps/nukhba-admin/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── تطبيق الطالب (TWA) ────────────────────────────────────────────────────────
jobs:
  build-student:
    name: "📱 Student APK (TWA)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: apps/nukhba-student
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -50

      - name: Print debug keystore fingerprint
        run: |
          echo ""
          echo "┌─────────────────────────────────────────────────────┐"
          echo "│  Debug Keystore SHA-256 Fingerprint (للتطوير فقط)  │"
          echo "└─────────────────────────────────────────────────────┘"
          keytool -list -v \
            -alias androiddebugkey \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            | grep "SHA256" || echo "(Debug keystore not found)"
          echo ""
          echo "⚠️  Fingerprint الإنتاج الفعلي موجود في:"
          echo "   artifacts/nukhba/public/.well-known/assetlinks.json"

      - name: Upload Student Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nukhba-student-debug
          path: apps/nukhba-student/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  # ── تطبيق الأدمن (WebView) ────────────────────────────────────────────────
  build-admin:
    name: "🛡️ Admin APK (WebView)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: apps/nukhba-admin
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -50

      - name: Upload Admin Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nukhba-admin-debug
          path: apps/nukhba-admin/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

