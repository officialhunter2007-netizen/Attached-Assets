name: Build Android APKs

on:
  push:
    branches: [main]
    paths:
      - 'apps/nukhba-student/**'
      - 'apps/nukhba-admin/**'
      - '.github/workflows/build-apk.yml'
      - '.github/signing/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── مفتاح التوقيع الثابت — موجود في .github/signing/nukhba.keystore ──────────
# نفس المفتاح في كل بناء = لا تعارض في التثبيت على الجهاز

jobs:
  build-student:
    name: "📱 Student APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Release APK (signed)
        working-directory: apps/nukhba-student
        env:
          KEYSTORE_PATH: ../../.github/signing/nukhba.keystore
          KEYSTORE_PASSWORD: nukhba2024
          KEY_ALIAS: nukhba
          KEY_PASSWORD: nukhba2024
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify signing fingerprint
        run: |
          keytool -list -v \
            -alias nukhba \
            -keystore .github/signing/nukhba.keystore \
            -storepass nukhba2024 \
            | grep "SHA256"

      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: nukhba-student
          path: apps/nukhba-student/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error

  build-admin:
    name: "🛡️ Admin APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Release APK (signed)
        working-directory: apps/nukhba-admin
        env:
          KEYSTORE_PATH: ../../.github/signing/nukhba.keystore
          KEYSTORE_PASSWORD: nukhba2024
          KEY_ALIAS: nukhba
          KEY_PASSWORD: nukhba2024
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify signing fingerprint
        run: |
          keytool -list -v \
            -alias nukhba \
            -keystore .github/signing/nukhba.keystore \
            -storepass nukhba2024 \
            | grep "SHA256"

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: nukhba-admin
          path: apps/nukhba-admin/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error
