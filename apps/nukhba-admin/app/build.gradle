plugins {
    id 'com.android.application'
}

android {
    namespace 'com.learnukhba.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.learnukhba.admin"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // KEYSTORE_PATH يُضبط من env var في GitHub Actions (مسار مطلق)
            storeFile     file(System.env.KEYSTORE_PATH ?: "/tmp/nukhba.keystore")
            storePassword System.env.KEYSTORE_PASSWORD ?: "nukhba2024"
            keyAlias      System.env.KEY_ALIAS         ?: "nukhba"
            keyPassword   System.env.KEY_PASSWORD      ?: "nukhba2024"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            signingConfig   signingConfigs.release
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
