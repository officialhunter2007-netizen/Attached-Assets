        - code [ref=e77]: "print(\"أهلاً بالعالم!\")``` هو الطريقة الصحيحة عشان تخلي بايثون تطبع لك جملة \"أهلاً بالعالم!\" على الشاشة. لاحظهنا شي مهم: * كتبنا `print` متبوعة بقوسين `()`. * وبداخل القوسين، حطينا النص اللي نبغى نطبعه، وهو \"أهلاً بالعالم!\"، **بين علامتي تنصيص مزدوجة**. هذه **علامات التنصيص** (`\"` أو `'`) مهمة جداً.تخيّل أنك بتكتب رسالة بخط إيدك، لازم تكتب الكلام اللي تبغى تقوله عشان اللي يقرأ يفهم إنه كلام. علامات التنصيص تخبر بايثون أن هذا **نص حرفي** (string) لازم يُقرأ ويُعرض كما هو. طيب، لو نسيت علامات التنصيص، شو تتوقع بيصير؟ هل بايثون بتفهم إن \"أهلاً بالعالم!\" نص عادي، ولا بتعتبره شي ثاني؟ [[ASK_OPTIONS: بتفهم إنه نص عادي وتطبعه ||| بتعتبره أمر برمجي ثاني ||| بتظهر خطأ لأنها ما عرفت إنه نص ||| غير ذلك]]"
